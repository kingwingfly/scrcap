[package]
name = "scrcap"
version = "0.0.0" # a placeholder: .github/workflows/publish.yml stamps the tag
edition = "2024"
description = "Screen and system-audio capture for Windows, macOS and Linux"
repository = "https://github.com/kingwingfly/scrcap"
documentation = "https://docs.rs/scrcap"
license = "MIT"
keywords = ["screen-capture", "screencast", "screenshot", "audio"]
categories = ["multimedia::video", "multimedia::audio", "os"]

[package.metadata.docs.rs]
# `libspa-sys` needs the system PipeWire headers and the docs.rs build image has no
# `libpipewire-0.3-dev`, so the Linux target cannot be documented there at all.
default-target = "x86_64-pc-windows-msvc"
targets = ["aarch64-apple-darwin"]

[dependencies]
crossbeam-channel = "0.5.17"
parking_lot = "0.12.5"
rand = { version = "0.10.2", optional = true }
thiserror = "2.0.20"
tracing = "0.1.44"

# Windows and macOS both resolve `Target::WindowName` with it.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
regex = "1.12.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Foundation_Metadata",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
crossbeam-utils = "0.8.23"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = { version = "0.3.2", features = ["SCShareableContent"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9.12", features = ["stdfd"] }
libc = "0.2.189"
pipewire = "0.10.1"

# Examples only
[dev-dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }    # data from cpu to gpu
env_logger = "0.11.11"
log = "0.4.34"
pollster = "1.0.1"
wgpu = "30.0.1"
winit = "0.30.13"

[features]
default = []
dummy = ["dep:rand"]
